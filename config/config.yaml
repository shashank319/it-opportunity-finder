  # --- Gmail bid-alert ingestion (PRIMARY local coverage) --------------------
  # Reads a dedicated Gmail inbox for alert emails from shared procurement
  # platforms. Turn `enabled: true` AFTER you set up GMAIL_TOKEN_JSON (README).
  # Add a new alert provider by adding a platform block — no code change.
  gmail_alerts:
    enabled: false
    name: "Email Alerts (Gmail)"
    lookback_days: 3          # look back this many days each run (cron is daily)
    max_messages: 200
    # extra_query: "label:bid-alerts"   # optional: restrict to a Gmail label

    platforms:
      # For each platform: match by sender (from_contains), and pull bid-detail
      # links whose URL contains one of link_contains. Optional regexes can pull
      # a deadline/agency out of the email body. Tune these as real alerts arrive.
      - name: PlanetBids
        enabled: true
        from_contains: ["planetbids.com"]
        link_contains: ["planetbids.com/portal", "vendors.planetbids.com"]

      - name: Bonfire
        enabled: true
        from_contains: ["bonfirehub.com", "gobonfire.com"]
        link_contains: ["bonfirehub.com/opportunities", "bonfirehub.com/portal"]

      - name: DemandStar
        enabled: true
        from_contains: ["demandstar.com"]
        link_contains: ["demandstar.com"]

      - name: OpenGov
        enabled: true
        from_contains: ["opengov.com", "procurement.opengov.com"]
        link_contains: ["procurement.opengov.com"]

      - name: Periscope / BidSync
        enabled: true
        from_contains: ["bidsync.com", "periscopeholdings.com", "public.periscopeholdings.com"]
        link_contains: ["bidsync.com", "periscopeholdings.com"]

      - name: Public Purchase
        enabled: true
        from_contains: ["publicpurchase.com"]
        link_contains: ["publicpurchase.com"]

      - name: Vendor Registry
        enabled: true
        from_contains: ["vendorregistry.com"]
        link_contains: ["vendorregistry.com"]

      - name: BidNet
        enabled: true
        from_contains: ["bidnetdirect.com", "bidnet.com"]
        link_contains: ["bidnetdirect.com"]

      - name: Ionwave
        enabled: true
        from_contains: ["ionwave.net"]
        link_contains: ["ionwave.net"]


# -----------------------------------------------------------------------------
# FILTERING — high recall, light touch. INCLUDE on IT keyword OR IT code;
# then drop ONLY clearly non-IT physical work (unless a strong software term
# is also present, in which case KEEP and let a human decide).
# -----------------------------------------------------------------------------
filtering:

  # Include if the title/description contains ANY of these (case-insensitive).
  include_keywords:
    - software
    - application
    - app
    - system
    - systems
    - cloud
    - saas
    - paas
    - iaas
    - migration
    - modernization
    - modernize
    - development
    - developer
    - integration
    - portal
    - website
    - web
    - database
    - data
    - analytics
    - license
    - digital
    - automation
    - rpa
    - workflow
    - platform
    - api
    - ecm
    - content management
    - document management
    - records management
    - laserfiche
    - mendix
    - low-code
    - low code
    - ".net"
    - dotnet
    - java
    - python
    - devops
    - cybersecurity
    - it services
    - information technology
    - crm
    - erp
    - sharepoint
    - servicenow
    - ai
    - artificial intelligence
    - machine learning
    - chatbot
    - hosting
    - programming
    - computer
    - e-government
    - egovernment
    - gis software
    - gis

  # Include if any of these codes appear in naics/psc/set_aside fields.
  # Substring match — listing "43" catches UNSPSC 43xxxxxx software/IT.
  # NAICS: IT services & data. NIGP: 208 software, 920 data processing,
  # 209 computer hardware/peripherals. Edit freely.
  include_codes:
    # --- IT NAICS ---
    - "541511"   # custom computer programming
    - "541512"   # computer systems design
    - "541519"   # other computer related services
    - "518210"   # data processing / hosting
    - "511210"   # software publishers
    - "541513"   # computer facilities management
    - "541611"   # admin/management consulting
    - "611420"   # computer training
    # --- UNSPSC software/IT family (prefix match) ---
    - "43"       # 43xxxxxx IT & software
    # --- NIGP commodity codes ---
    - "208"      # computer software
    - "920"      # data processing / IT services
    - "209"      # computer hardware & peripherals

  # Drop ONLY if one of these matches AND no strong-software term is present.
  exclude_keywords:
    - cabling
    - cable installation
    - wiring
    - electrical
    - conduit
    - fiber installation
    - network hardware installation
    - structured cabling
    - desktop hardware
    - pc hardware
    - roadwork
    - road construction
    - paving
    - hvac
    - plumbing
    - janitorial
    - landscaping
    - construction
    - furniture
    - uniforms
    - catering
    - vehicle
    - fuel
    - generator
    # --- Construction / facilities / physical work (your firm does none of it) ---
    - renovate
    - renovation
    - rehabilitate
    - rehab
    # Job Order Contracts (JOC) are open-ended construction/trade work
    # agreements — always physical work, never IT (e.g. LACDA26-043).
    # Deliberately NOT listing "alteration" here: OpenGov's standard legal
    # boilerplate says "modification or alteration of the documents contained
    # in this solicitation", so it appears on essentially every OpenGov
    # listing and would drop genuine IT work (verified: it dropped a
    # "Website Redesign and Hosting Services" test item).
    - job order contract
    - remodeling
    - refurbishment
    - roof
    - roofing
    - facade
    - masonry
    - concrete
    - demolition
    - boiler
    - chiller
    - elevator
    - escalator
    - heating
    - mechanical
    - sidewalk
    - sewer
    - bridge
    - asphalt
    - painting
    - flooring
    - grounds maintenance
    - mowing
    - food distribution
    - food service

  # --- Active-only date filter -----------------------------------------------
  # Show only opportunities that are still ACCEPTING BIDS.
  #   * If an item has a deadline, keep it only if the deadline is today/later.
  #   * If it has no deadline, keep it only if posted within stale_after_days.
  # Set drop_expired: false to see everything (including closed/old ones).
  drop_expired: true
  stale_after_days: 150

  # If ANY of these appears, we KEEP the item even when an exclude term matches.
  # (These are the unambiguous "this is really software" signals.)
  strong_software_keywords:
    - software
    - application
    - saas
    - cloud
    - laserfiche
    - mendix
    - low-code
    - low code
    - ".net"
    - dotnet
    - java
    - api
    - database
    - erp
    - crm
    - modernization
    - migration
    - integration
    - analytics
    - information technology
    - it services
    - web application
    - custom software

  # These include_keywords are too generic to trust on their own — each one
  # has a common non-IT meaning ("system of care" in social services, "hard
  # hat application", "recreational programming", "leadership development",
  # "wastewater systems"). An item only gets INCLUDED on one of these if it
  # ALSO matches a different, more specific include_keyword (or an IT code) —
  # matching only on these, however many times, is not enough by itself.
  ambiguous_keywords:
    - system
    - systems
    - development
    - application
    - programming
    - platform
    - integration
    - modernization
    - automation
    - computer


# -----------------------------------------------------------------------------
# SCORING — 0-100, used ONLY for sorting. It never hides anything.
# score = base + per_hit*(#include hits) + tier1_weight*(#tier1 hits) + code_bonus
# -----------------------------------------------------------------------------
scoring:
  base: 30
  per_hit: 6
  tier1_weight: 15
  code_hit_bonus: 20
  # Tier-1 = our sweet-spot capabilities; these push the score up the most.
  tier1_keywords:
    - laserfiche
    - mendix
    - low-code
    - low code
    - ".net"
    - dotnet
    - java
    - software
    - cloud
    - saas
    - modernization
    - migration
    - integration
    - custom software
    - document management
    - content management
    - erp
    - crm


# -----------------------------------------------------------------------------
# HISTORY — how long to remember seen opportunities (for cross-day dedupe).
# -----------------------------------------------------------------------------
history:
  retention_days: 180


# -----------------------------------------------------------------------------
# IT CODE REFERENCE — the labeled list shown in the dashboard "Code" dropdown.
# Each entry has a type (NAICS / NIGP / PSC / UNSPSC), the code, and a name.
# These are the IT/SOFTWARE codes we care about (not hardware). The dashboard
# shows every one of these with a live count of how many projects match today.
# Codes only appear on federal (NAICS/PSC) and PlanetBids (NIGP) projects; most
# local feeds carry no codes, so many will show a count of 0 — that's expected.
# -----------------------------------------------------------------------------
it_code_reference:
  # --- NAICS (U.S. industry codes) ---
  - { type: NAICS, code: "541511", name: "Custom Computer Programming Services" }
  - { type: NAICS, code: "541512", name: "Computer Systems Design Services" }
  - { type: NAICS, code: "541513", name: "Computer Facilities Management Services" }
  - { type: NAICS, code: "541519", name: "Other Computer Related Services" }
  - { type: NAICS, code: "518210", name: "Data Processing, Hosting & Related Services" }
  - { type: NAICS, code: "511210", name: "Software Publishers" }
  - { type: NAICS, code: "541611", name: "Admin & General Management Consulting" }
  - { type: NAICS, code: "611420", name: "Computer Training" }
  # --- NIGP (local-government commodity codes — software & IT services) ---
  - { type: NIGP, code: "208", name: "Computer Software — Microcomputers (incl. cloud)" }
  - { type: NIGP, code: "209", name: "Computer Software — Mini/Mainframe" }
  - { type: NIGP, code: "920", name: "Data Processing, Programming & Software Services" }
  # --- PSC (federal product/service codes) ---
  - { type: PSC, code: "DA01", name: "IT — Application Development Services" }
  - { type: PSC, code: "DA10", name: "IT — Application (SaaS) Services" }
  - { type: PSC, code: "D302", name: "IT Systems Development (legacy)" }
  - { type: PSC, code: "D307", name: "IT Systems Analysis (legacy)" }
  - { type: PSC, code: "D306", name: "IT Programming (legacy)" }
  - { type: PSC, code: "D308", name: "Programming Services (legacy)" }
  - { type: PSC, code: "D310", name: "IT Support / Security Services (legacy)" }
  - { type: PSC, code: "7030", name: "IT Software (product)" }
  # --- UNSPSC (broad IT/software family) ---
  - { type: UNSPSC, code: "43", name: "IT, Software & Telecom (43xxxxxx)" }


# -----------------------------------------------------------------------------
# PRODUCT OPPORTUNITIES — group opportunities into software "themes" and rank
# them by how many DISTINCT agencies/states are asking. A theme wanted by many
# governments is a strong candidate to build once and sell to many (a product).
# Edit the themes/keywords freely; each keyword is matched as a whole word.
# -----------------------------------------------------------------------------
product_themes:
  min_agencies: 2        # only surface a theme if >= this many distinct agencies want it
  themes:
    - name: "Permitting & Licensing"
      keywords: [permit, permitting, license, licensing, "code enforcement", "land management"]
    - name: "Records & Document Management (ECM)"
      keywords: ["records management", "document management", "content management", ecm, laserfiche, digitization, imaging, scanning]
    - name: "Public Records / FOIA Tracking"
      keywords: ["public record", "public records", foia, "records request"]
    - name: "311 / Case & Constituent Management"
      keywords: [311, "case management", "service request", constituent, "citizen request"]
    - name: "Agenda / Meeting / Legislative"
      keywords: [agenda, "meeting management", legislative, minutes, boardbook]
    - name: "GIS / Mapping"
      keywords: [gis, mapping, geospatial]
    - name: "Payments / Billing / Citations"
      keywords: [payment, payments, billing, citation, citations, cashiering, "utility billing"]
    - name: "ERP / Finance / HR"
      keywords: [erp, "financial system", "financial management", payroll, "human resources", hris, "time survey", timekeeping]
    - name: "Asset / Work Order (EAM/CMMS)"
      keywords: ["asset management", "work order", "maintenance management", cmms, eam, "fleet management"]
    - name: "Data / Analytics / Dashboards"
      keywords: ["data management", "data platform", analytics, "data warehouse", "business intelligence", dashboard, "data exchange", "master patient index"]
    - name: "Website / Portal / Digital Services"
      keywords: [website, "web portal", "digital service", "e-government", egovernment, "online portal"]
    - name: "Cybersecurity"
      keywords: [cybersecurity, "security assessment", siem, vulnerability, "penetration test", "security testing"]
    - name: "Health & Human Services Systems"
      keywords: [eligibility, benefits, medicaid, "child welfare", "human services", "social services"]
    - name: "Cloud Migration & Modernization"
      keywords: [migration, modernization, modernize, "legacy system", "cloud migration"]


# -----------------------------------------------------------------------------
# OPTIONAL Claude classifier for borderline IT-vs-non-IT calls.
# OFF by default so the baseline cost is $0 (pure keyword/code filtering).
# (Wiring is a later step; this flag is here so the config shape is stable.)
# -----------------------------------------------------------------------------
claude_classifier:
  enabled: false
  model: claude-haiku-4-5-20251001

  # --- ArcGIS feature layers -------------------------------------------------
  # Some governments publish open solicitations as an ArcGIS layer with a public
  # query API. Add one by copying a block (query_url + field_map).
  arcgis_layers:
    - name: "Washington DC — Solicitations (PASS)"
      enabled: true
      state: DC
      query_url: "https://maps2.dcgis.dc.gov/dcgis/rest/services/DCGIS_DATA/Government_Operations/MapServer/19/query"
      where: "EVENTDISPLAYSTATUS='OPEN'"
      field_map: { id: SOLICITATIONNUMBER, title: SOLICITATIONTITLE, description: SYNOPSIS, agency: AGENCY_NAME, due_date: CLOSEDATE }
      date_fields: ["due_date"]
      source_url: "https://ocp.dc.gov/service/solicitations"

  # --- BidNet Direct agency portals -------------------------------------------
  # Public, server-rendered "Bid Opportunities and RFPs" page per agency (no
  # login). Add an agency by adding its path (the part after bidnetdirect.com/
  # in its portal URL, e.g. bidnetdirect.com/california/cityofsantaclara ->
  # path "california/cityofsantaclara").
  bidnetdirect:
    enabled: true
    name: "BidNet Direct"
    agency_delay: 2           # seconds between agencies; bidnetdirect.com blocks rapid bursts (HTTP 405)
    agencies:
      - { path: "california/cityofsantaclara", agency: "City of Santa Clara, CA", state: CA }
      - { path: "california/contracostacounty", agency: "Contra Costa County, CA", state: CA }
      - { path: "new-york/city-of-albany", agency: "City of Albany, NY", state: NY }
      - { path: "new-york/city-of-schenectady", agency: "City of Schenectady, NY", state: NY }
      - { path: "florida/cityofmiami", agency: "City of Miami, FL", state: FL }

    # Illinois - https://cdb.illinois.gov/ Construction-only procurement portal (state facilities, HVAC, roofing, fire alarms, water systems, etc.). No IT-related opportunities; exclude from the IT Opportunity Finder.
    # - name: "Illinois — Capital Dev Board Future Solicitations"
